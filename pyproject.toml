[project]
name = "seshat"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.1.1",
    "nooa-memory>=0.0.10",
    "nooa[cli,mcp,memory,viewer]>=0.0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pyyaml>=6.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seshat"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "controls", "governance"]
# tests/fixtures/ is committed test data (a hand-written probe repo whose
# .codegraph/codegraph.db line spans must stay in sync with its source), not project
# source. Lint/format must never rewrite it.
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear: mutable defaults, swallowed excepts, loop-variable capture
  "I",   # import sorting
  "RUF", # ruff's own correctness rules
  "UP",  # pyupgrade
]
ignore = [
  # NOOA reads a `...` method body as a generation point: the model implements the
  # method at call time. PIE790 sees only a docstring plus a redundant placeholder and
  # deletes it, which silently turns the agent method into a no-op returning None.
  # See nooa/ellipsis_detection.py:has_ellipsis_body.
  "PIE790",
]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
# The governance scripts are executables, not an installed package, so ty needs the
# same search path pytest gets from `pythonpath` below.
extra-paths = ["governance/scripts"]

[tool.ty.src]
# tests/fixtures/ is committed test data; see the ruff exclude above.
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "governance/scripts"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
