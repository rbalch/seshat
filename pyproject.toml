[project]
name = "seshat"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.1.1",
    "nooa-memory>=0.0.10",
    "nooa[cli,mcp,memory,viewer]>=0.0.10",
]

[project.scripts]
seshat = "seshat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pyyaml>=6.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seshat"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "controls", "governance"]
# tests/fixtures/ is committed test data (a hand-written probe repo whose
# .codegraph/codegraph.db line spans must stay in sync with its source), not project
# source. Lint/format must never rewrite it.
extend-exclude = ["tests/fixtures/"]

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear: mutable defaults, swallowed excepts, loop-variable capture
  "I",   # import sorting
  "RUF", # ruff's own correctness rules
  "UP",  # pyupgrade
]
ignore = [
  # NOOA reads a `...` method body as a generation point: the model implements the
  # method at call time. PIE790 sees only a docstring plus a redundant placeholder and
  # deletes it, which silently turns the agent method into a no-op returning None.
  # See nooa/ellipsis_detection.py:has_ellipsis_body.
  "PIE790",
]

[tool.ruff.lint.per-file-ignores]
# See DEC-2. Currently a no-op: "S" is not in [tool.ruff.lint] extend-select above, so
# S102 is never active here regardless of this ignore -- verified directly (DEC-2's
# Context). Kept anyway: harmless now, becomes load-bearing the moment "S" is selected.
"src/seshat/verify.py" = ["S102"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
# The governance scripts and fitness controls are executables, not an installed
# package, so ty needs the same search paths pytest gets from `pythonpath` below.
extra-paths = ["governance/scripts", "controls/fitness"]

[tool.ty.src]
# tests/fixtures/ is committed test data; see the ruff exclude above.
exclude = ["tests/fixtures/"]

[[tool.ty.overrides]]
# Same rationale as the ruff PIE790 ignore above: a NOOA generation-point method's
# body is `...` by design (see nooa/ellipsis_detection.py:has_ellipsis_body), which
# ty otherwise reports as an implicit `None` return against a non-`None` annotation.
# Scoped to this one file, mirroring how DEC-1's own ruff `S102` ignore is scoped
# per-file rather than repo-wide (pyproject.toml `[tool.ruff.lint.per-file-ignores]`)
# — the next generation-point agent (worker, reflection, answer) widens this list
# when it lands, rather than this pre-covering files that do not exist yet.
include = [
  "src/seshat/agents/verifier_author.py",
  "src/seshat/agents/worker.py",
  "src/seshat/agents/reflection.py",
  "src/seshat/agents/answer.py",
]

[tool.ty.overrides.rules]
empty-body = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "governance/scripts", "controls/fitness"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "integration: needs LLM_HOST and a live model",
]
