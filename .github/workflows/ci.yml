name: CI

# The same gate as `make check`, in the same order, as separate steps so a red build
# names which stage failed:
#
#   controls      prove the rules bite
#   views --check prove the generated view is current
#   governance    prove nothing drifted
#   test          prove the harness itself works
#
# Do not reorder these. Running `governance` before `controls` would report drift in a
# tree whose rules were never executed.

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails rather than silently resolving something new, so CI tests the
        # dependency set that was committed.
        run: uv sync --locked

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install codegraph
        # Several tests (T-14: tests/test_units.py) index a throwaway repo with a real
        # `codegraph init` rather than a committed fixture or a hand-built sqlite index,
        # to prove enumerate_units survives what codegraph itself produces for an
        # undecodable file — a hand-built index can't stand in for that. Pinned to the
        # exact version this repo is developed against; an unpinned install would let a
        # future release break CI at random.
        run: npm install -g @colbymchenry/codegraph@1.6.0

      - name: Controls
        run: make controls

      - name: Views are current
        run: uv run python governance/scripts/build_views.py --check

      - name: Governance
        run: make governance

      - name: Tests
        run: make test
